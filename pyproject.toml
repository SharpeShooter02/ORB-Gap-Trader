[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-live"
version = "0.1.0"
description = "Live trading system for the ORB leveraged-ETF strategy"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.13",
    "sqlalchemy>=2.0",
    "structlog>=23.0",
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orb_live*"]

[tool.pytest.ini_options]
testpaths = ["orb_live/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
